function checkDistance(int_num,cur_stone,direction) {
    //var str = checkDirection(direction);
    
    if(direction == "right") {
        var i = 0;
        while(int_num % 8 != 2 || document.getElementById(int_num).value == "　") {
            if(document.getElementById(int_num).value == cur_stone) {
                return i;
            } 
            int_num = int_num - 1;
            if( int_num % 8 == 2  || document.getElementById(int_num).value == "　") {
                 break;
            }
            
            i = i + 1;
        }
        return 0;
    } else if(direction == "left") {
        i = 0;
        while(int_num % 8 != 3 ) {
            if(document.getElementById(int_num).value == cur_stone) {
                return i;
            } 
            int_num = int_num + 1;
            if( int_num % 8 == 3 || int_num > 74  || document.getElementById(int_num).value == "　") {
                 break;
            }
            i = i + 1;
        }
        return 0;
    } else if(direction == "up") {
        i = 0;
        while(int_num > 10 ) {
            
            if(document.getElementById(int_num).value == cur_stone) {
                return i;
            } 
            int_num = int_num - 8;
            if(int_num < 11 || document.getElementById(int_num).value == "　") {
                return 0;
            }
            i = i + 1;
        }
        return 0;
    } else if(direction == "down") {
        i = 0;
        while(int_num < 75 ) {
            
            if(document.getElementById(int_num).value == cur_stone) {
                return i;
            } 
            int_num = int_num + 8;
            if(int_num > 74 || document.getElementById(int_num).value == "　") {
                return 0;
            }
            i = i + 1;
        }
        return 0;
    } else if(direction == "rightup") {
        i = 0;
        while(int_num > 11 && int_num % 8 != 2) {

            if(document.getElementById(int_num).value == cur_stone) {
                return i;
            }

            if(int_num < 11 || int_num % 8 == 3) {
                break;
            }
            i = i + 1;
            int_num = int_num - 9;
        }
        return 0;
    } else if(direction == "leftup") {
        i = 0;
        while(int_num > 11 && int_num % 8 != 3) {
            
            if(document.getElementById(int_num).value == cur_stone) {
                return i;
            }
            i = i + 1;
            int_num = int_num - 7;
            if(int_num < 11 || int_num % 8 == 3) {
                break;
            }
        }
        return 0;
    } else if(direction == "rightdown") {
        i = 0;
        while(int_num < 74 && int_num % 8 != 2) {
            
            if(document.getElementById(int_num).value == cur_stone) {
                return i;
            }
            i = i + 1;
            int_num = int_num + 7;
            if(int_num > 74 || int_num % 8 == 2) {
                break;
            }
        }
        return 0;
    } else if(direction == "leftdown") {
        i = 0;
        while(int_num < 74 && int_num % 8 != 3) {
            
            if(document.getElementById(int_num).value == cur_stone) {
                return i;
            }
            i = i + 1;
            int_num = int_num + 9;
            if(int_num > 74 || int_num % 8 == 3) {
                break;
            }
        }
        return 0;
    }
    
    
    
}
function btnClick(num){
    var str = num;
    var cur_stone;
    var check = 0;
    var gorobee = document.getElementById("gorobe").value;
    
    if(document.getElementById("gorobe").value % 2 == 0) {
        cur_stone = "●";
    } else {
        cur_stone = "〇";
    }
    if(document.getElementById(str).value != "　"){
        return;
    }
    //cur_stone = document.getElementById(str).value;
    check = check_right(str, cur_stone);
    //alert("右");
    //alert(check);
    var left_rtn = check_left(str, cur_stone);
    check = parseInt(check) + parseInt(left_rtn);
    //alert("左");
    //alert(check);
    var up_rtn = check_up(str, cur_stone);
    check = parseInt(check) + parseInt(up_rtn);
    //alert("上");
    //alert(check);   
    var down_rtn = check_down(str, cur_stone);
    check = parseInt(check) + parseInt(down_rtn);
    var rightup_rtn = check_rightup(str, cur_stone);
    check = parseInt(check) + parseInt(rightup_rtn);
    var leftup_rtn = check_leftup(str, cur_stone);
    check = parseInt(check) + parseInt(leftup_rtn);    
    var rightdown_rtn = check_rightdown(str, cur_stone);
    check = parseInt(check) + parseInt(rightdown_rtn);
    var leftdown_rtn = check_leftdown(str, cur_stone);
    check = parseInt(check) + parseInt(leftdown_rtn);      
    //alert("check");
    //alert(check);       
    if(check > 0){
        document.getElementById(str).value = cur_stone;
        document.getElementById("gorobe").value = parseInt(gorobee) + 1;
    }
    if(parseInt(gorobee)  % 2 == 1) {
        document.getElementById("gorobe1").value = "黒の番";
    } else {
        document.getElementById("gorobe1").value = "白の番";
    }
}
function changeTurn(){
    var gorobee = document.getElementById("gorobe").value;
    document.getElementById("gorobe").value = parseInt(gorobee) + 1;
    if(parseInt(gorobee)  % 2 == 1) {
        document.getElementById("gorobe1").value = "黒の番";
    } else {
        document.getElementById("gorobe1").value = "白の番";
    }
}

function autoChange(num){
    var str = num;
    if(document.getElementById(str).value =="") {
        document.getElementById(str).value = "〇";
    } else if(document.getElementById(str).value =="〇") {
        document.getElementById(str).value = "●";
    } else {
        document.getElementById(str).value = "〇";
    }
}
function finalJudge() {
    var black = 0;
    var white = 0;
    for(var i = 11; i < 75; i++) {
        if(document.getElementById(i).value =="〇") {
            white = white + 1;
        } else if(document.getElementById(i).value == "●"){
            black = black + 1;
        }
    }
    if(white > black) {
        alert("白の勝ちです");
    } else if(black > white) {
        alert("黒の勝ちです");
    } else {
        alert("引き分けです");
    }
}
